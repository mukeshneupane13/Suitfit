name: Build SuitFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-package

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/SuitFlow-installable.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/SuitFlow-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SuitFlow-APK
          path: |
            android-package/app/build/outputs/apk/SuitFlow-installable.apk
            android-package/app/build/outputs/apk/SuitFlow-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
